<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="pi.css" />
    <script src="pi.js"></script>
    <script src="common.js"></script>
  </head>
  <body>
    <div id="banner" class="banner offline">
      <span class="dot"></span><span id="banner-text">Connecting…</span>
    </div>

    <div class="item">
      <label for="slot"
        >Fixed slot (leave blank to follow the active agent)</label
      >
      <input
        type="number"
        id="slot"
        min="0"
        step="1"
        placeholder="active agent"
      />
      <div class="hint">
        Set 0,1,2… on several keys to build a Multi-Agent Grid.
      </div>
    </div>

    <div class="section">
      <h3>Orca CLI</h3>
      <div class="item">
        <label for="cliPath">CLI path (auto to auto-detect)</label>
        <input type="text" id="cliPath" placeholder="auto" />
      </div>
      <div class="item">
        <label for="pollSeconds">Poll interval (seconds, 2–10)</label>
        <input type="number" id="pollSeconds" min="2" max="10" step="1" />
      </div>
    </div>

    <div class="section">
      <h3>
        Live
        <button id="refresh" type="button" style="float: right">Refresh</button>
      </h3>
      <div class="item">
        <label>Agents (in order = slot index)</label>
        <div id="agent-list" class="list"></div>
      </div>
      <div class="item">
        <label>Worktrees</label>
        <div id="worktree-list" class="list"></div>
      </div>
    </div>

    <script>
      window.orcaPI.onReady(function (r) {
        const slot = window.orcaCommon.el("slot");
        const s = r.settings || {};
        if (typeof s.slot === "number") slot.value = String(s.slot);
        slot.addEventListener("change", function () {
          const v = slot.value.trim();
          window.orcaPI.setSetting(
            "slot",
            v === "" ? undefined : Math.max(0, Number(v) || 0)
          );
        });
      });
      window.orcaCommon.init();
    </script>
  </body>
</html>
