<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="pi.css" />
    <script src="pi.js"></script>
    <script src="common.js"></script>
  </head>
  <body>
    <div id="banner" class="banner offline">
      <span class="dot"></span><span id="banner-text">Connecting…</span>
    </div>

    <div class="item">
      <label for="label">Button label</label>
      <input type="text" id="label" placeholder="Fix Tests" />
    </div>
    <div class="item">
      <label for="prompt">Prompt text</label>
      <textarea
        id="prompt"
        placeholder="Run all relevant tests and fix any failures."
      ></textarea>
    </div>
    <div class="item">
      <label for="target">Target</label>
      <select id="target">
        <option value="active-agent">Active agent</option>
        <option value="specific-agent">Specific agent</option>
        <option value="specific-worktree">Specific worktree</option>
      </select>
    </div>
    <div class="item" id="agent-row" style="display: none">
      <label for="agentId">Agent</label>
      <select id="agentId">
        <option value="">— select —</option>
      </select>
    </div>
    <div class="item" id="worktree-row" style="display: none">
      <label for="worktreeSel">Worktree</label>
      <select id="worktreeSel">
        <option value="">— select —</option>
      </select>
    </div>
    <div class="item row">
      <input type="checkbox" id="sendEnter" checked />
      <label for="sendEnter" style="margin: 0">Send Enter after prompt</label>
    </div>
    <div class="item row">
      <input type="checkbox" id="confirm" />
      <label for="confirm" style="margin: 0"
        >Confirm before sending (tap twice)</label
      >
    </div>

    <div class="section">
      <h3>Orca CLI</h3>
      <div class="item">
        <label for="cliPath">CLI path (auto to auto-detect)</label>
        <input type="text" id="cliPath" placeholder="auto" />
      </div>
      <div class="item">
        <label for="pollSeconds">Poll interval (seconds, 2–10)</label>
        <input type="number" id="pollSeconds" min="2" max="10" step="1" />
      </div>
    </div>

    <div class="section">
      <h3>
        Live
        <button id="refresh" type="button" style="float: right">Refresh</button>
      </h3>
      <div class="item">
        <label>Agents</label>
        <div id="agent-list" class="list"></div>
      </div>
      <div class="item">
        <label>Worktrees</label>
        <div id="worktree-list" class="list"></div>
      </div>
    </div>

    <script>
      var C = window.orcaCommon;
      function el(id) {
        return C.el(id);
      }

      function updateTargetRows(v) {
        el("agent-row").style.display = v === "specific-agent" ? "" : "none";
        el("worktree-row").style.display =
          v === "specific-worktree" ? "" : "none";
      }

      window.orcaPI.onReady(function (r) {
        var s = r.settings || {};
        el("label").value = s.label || "";
        el("prompt").value = s.prompt || "";
        el("target").value = s.target || "active-agent";
        el("sendEnter").checked = s.sendEnter !== false;
        el("confirm").checked = s.confirm === true;
        updateTargetRows(el("target").value);

        el("label").addEventListener("input", function () {
          window.orcaPI.setSetting("label", el("label").value);
        });
        el("prompt").addEventListener("input", function () {
          window.orcaPI.setSetting("prompt", el("prompt").value);
        });
        el("target").addEventListener("change", function () {
          window.orcaPI.setSetting("target", el("target").value);
          updateTargetRows(el("target").value);
        });
        el("sendEnter").addEventListener("change", function () {
          window.orcaPI.setSetting("sendEnter", el("sendEnter").checked);
        });
        el("confirm").addEventListener("change", function () {
          window.orcaPI.setSetting("confirm", el("confirm").checked);
        });
        el("agentId").addEventListener("change", function () {
          window.orcaPI.setSetting("agentId", el("agentId").value);
        });
        el("worktreeSel").addEventListener("change", function () {
          var opt = el("worktreeSel").selectedOptions[0];
          window.orcaPI.setSetting("worktreePath", el("worktreeSel").value);
          window.orcaPI.setSetting(
            "titleHint",
            (opt && opt.getAttribute("data-hint")) || ""
          );
        });
      });

      C.init(function (state) {
        var s = window.orcaPI.getSettings();
        C.fillSelect(
          el("agentId"),
          state.agents || [],
          function (a) {
            return {
              value: a.id,
              label:
                (a.agentType || "agent") +
                " · " +
                a.label +
                " [" +
                a.state +
                "]",
            };
          },
          s.agentId
        );
        C.fillSelect(
          el("worktreeSel"),
          state.worktrees || [],
          function (w) {
            return { value: w.path, label: w.repo + " · " + w.branch };
          },
          s.worktreePath
        );
      });
    </script>
  </body>
</html>
