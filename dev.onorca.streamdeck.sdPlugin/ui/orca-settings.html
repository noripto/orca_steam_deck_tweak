<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="pi.css" />
    <script src="pi.js"></script>
    <script src="common.js"></script>
  </head>
  <body>
    <div id="banner" class="banner offline">
      <span class="dot"></span><span id="banner-text">Connecting…</span>
    </div>

    <div class="section">
      <h3>Orca CLI</h3>
      <div class="item">
        <label for="cliPath">CLI path (leave "auto" to auto-detect)</label>
        <input type="text" id="cliPath" placeholder="auto" />
        <div class="hint">Windows example: %LOCALAPPDATA%\Programs\orca\resources\bin\orca.exe</div>
      </div>
      <div class="item">
        <label for="pollSeconds">Poll interval (seconds, 2–10)</label>
        <input type="number" id="pollSeconds" min="2" max="10" step="1" />
      </div>
    </div>

    <div class="section">
      <h3>Live <button id="refresh" type="button" style="float:right">Refresh</button></h3>
      <div class="item"><label>Agents</label><div id="agent-list" class="list"></div></div>
      <div class="item"><label>Worktrees</label><div id="worktree-list" class="list"></div></div>
    </div>

    <script>
      window.orcaCommon.init();
    </script>
  </body>
</html>
